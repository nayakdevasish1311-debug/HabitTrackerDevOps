
apiVersion: apps/v1
kind: Deployment
metadata:
  name: habit-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: habit-v2
  template:
    metadata:
      labels:
        app: habit-v2
    spec:
      containers:
        - name: habit-tracker
          image: devashis1311/habit-tracker:v2
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: habit-v2-service
spec:
  type: NodePort
  selector:
    app: habit-v2
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30082
